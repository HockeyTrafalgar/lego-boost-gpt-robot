		async function captureAndProcessImage() {
		  // Check if the browser supports the required features
		  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.ImageCapture || !HTMLCanvasElement.prototype.toBlob) {
		    throw new Error('Browser does not support required media devices.');
		  }

		  // Try to get access to the camera
		  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
		  const track = stream.getVideoTracks()[0];
		  const imageCapture = new ImageCapture(track);

		  // Capture the image as a blob
		  const blob = await imageCapture.takePhoto();

		  // Create an image element to load the blob
		  const image = new Image();
		  const url = URL.createObjectURL(blob);
		  image.src = url;

		  // Ensure the image has loaded before processing
		  await new Promise((resolve) => {
		    image.onload = resolve;
		  });

		  // Create a canvas to perform the cropping and resizing
		  const canvas = document.createElement('canvas');
		  const context = canvas.getContext('2d');
		  canvas.width = 512;
		  canvas.height = 512;

		  // Calculate the scale for the image
		  const scale = Math.min(image.width / canvas.width, image.height / canvas.height);

		  // Calculate the top left corner of the cropped image
		  const left = (image.width - scale * canvas.width) / 2;
		  const top = (image.height - scale * canvas.height) / 2;

		  // Draw the cropped and scaled image onto the canvas
		  context.drawImage(image, left, top, scale * canvas.width, scale * canvas.height, 0, 0, canvas.width, canvas.height);

		  // Stop the camera stream
		  track.stop();
		  
		  // Convert the canvas to a data URL (base64)
		  return new Promise((resolve, reject) => {
		    canvas.toBlob((blob) => {
		      const reader = new FileReader();
		      reader.onloadend = () => resolve(reader.result);
		      reader.onerror = reject;
		      reader.readAsDataURL(blob);
		    }, 'image/jpeg');
		  });
		}

		function checkIfControlsUpdated(){
			if (controlsBefore != JSON.stringify(controls)){
				if (controls.w){
						if (controls.a){
							//left
							boost.motorTimeMultiAsync(60,controls.driveSpeed*turnRate,controls.driveSpeed);
						}else if(controls.d){
							//right
							boost.motorTimeMultiAsync(60,controls.driveSpeed,controls.driveSpeed*turnRate);
						}else{
							//forward 
							boost.motorTimeMultiAsync(60,controls.driveSpeed,controls.driveSpeed);
						}

				}else if (controls.s){
						if (controls.a){
							//left back
							boost.motorTimeMultiAsync(60,-controls.driveSpeed*turnRate,-controls.driveSpeed);
						}else if(controls.d){
							//right back
							boost.motorTimeMultiAsync(60,-controls.driveSpeed,-controls.driveSpeed*turnRate);
						}else{
							//back 
							boost.motorTimeMultiAsync(60,-controls.driveSpeed,-controls.driveSpeed);
						}

				}else if (controls.a){
					//left spin
					boost.motorTimeMultiAsync(60,0,spinSpeed);
				}else if(controls.d){
					//right spin
					boost.motorTimeMultiAsync(60,spinSpeed,0);
				}else{
					//back 
					console.log("stop");
					boost.stop();
				} 

				controlsBefore = JSON.stringify(controls);
			}
		}

		configuration.driveSpeed = 50;

		configuration.defaultStopDistance = 130;
		configuration.defaultClearDistance = 180;

					console.log("Connected!");

					
					displayStatus();
					say("I'm ready!");

	async function penUp(){ // - raise the pen up

	async function penDown(){//} - lower the pen to start drawing

	async function rollEgg(angle){// - roll the egg for the specified angle, in degrees. Can be positive and negative
		console.log("rollEgg: ",angle);
		var power = angle<0?50:-50;
		return boost.motorAngleAsync("A", Math.abs(angle)*6.1,power);
	}

	var penZero=0;
	var penPosition;

	async function resetPenToZero(){
		console.log("resetPenToZero");
		penPosition=0;

		return boost.motorAngleAsync("D", 1000, 10).then(
			function(){
			penZero = boost.deviceInfo.ports.D.angle;
			console.log("Pen zero angle = ",penZero);
			}
		);
	}

	//move the pen to a specified position along the egg, in milimeters. Range from 0 to 40. Minimal step is 5 mm
	//360 degrees = 25mm
	async function movePen(position){ 
		
		console.log("movePen: ",position);

		if (position>40) position = 40;

		var desiredAngle = penZero - position*360/23;
		rotation = boost.deviceInfo.ports.D.angle-desiredAngle;
		var power = rotation<0?30:-30;

		penPosition = position;
		return boost.motorAngleAsync("D", Math.abs(rotation), power, true);
	}

	function testEgg(){
		stepPattern();
	}


	// Draw a step pattern around the edd starting from xPosition from the left end
	async function stepPattern(xPosition) {
		await resetPenToZero();           // Reset the pen to make sure zero position is correct
		await movePen(xPosition);         // Move pen to the starting position
		await penDown();                  // Put the pen down to start drawing

		for (i=0; i<6; i++){
			await movePen(xPosition+5);     // Move the pen 5mm to draw a dash to the right 
			await rollEgg(360/12);        // Rotate the egg 1/12 of full turn to draw a dash down
			await movePen(xPosition);       // Move the pen 5mm to draw a dash to the left 
			await rollEgg(360/12);        // Rotate the egg 1/12 of full turn to draw a dash down
		}  

		return await penUp();             // Finish by raising the pen
	}

	// Function to draw a solid line around the egg
	async function lineAround(xPosition) {
		await resetPenToZero();      // Reset the pen to make sure zero position is correct
		await movePen(xPosition);    // Move pen to the starting position
		await penDown();             // Put the pen down to start drawing
		await rollEgg(360);        // Rotate the egg 360 degrees to draw a full circle
		return await penUp();        // Finish by raising the pen
	}
