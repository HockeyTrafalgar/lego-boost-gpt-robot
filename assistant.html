function fullscreen(f){
	if (f) {
			$('#menu').hide();

			if (document.documentElement.requestFullscreen) {
				document.documentElement.requestFullscreen();
			} else if (document.documentElement.mozRequestFullScreen) { /* Firefox */
				document.documentElement.mozRequestFullScreen();
			} else if (document.documentElement.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
				document.documentElement.webkitRequestFullscreen();
			} else if (document.documentElement.msRequestFullscreen) { /* IE/Edge */
				document.documentElement.msRequestFullscreen();
			}

		} else {
			$('#menu').show();

			if (document.exitFullscreen) {
				document.exitFullscreen();
			} else if (document.webkitExitFullscreen) {   // Chrome, Safari (and Opera 15+)
				document.webkitExitFullscreen();
			} else if (document.mozCancelFullScreen) {    // Firefox
				document.mozCancelFullScreen();
			} else if (document.msExitFullscreen) {       // IE11+
				document.msExitFullscreen();
			}	
		}
}

var controlsBefore;

function checkIfControlsUpdated(){
	if (controlsBefore != JSON.stringify(controls)){
		if (controls.w){
			if (controls.a){
				//left
				boost.motorTimeMultiAsync(60,controls.driveSpeed*turnRate,controls.driveSpeed);
			}else if(controls.d){
				//right
				boost.motorTimeMultiAsync(60,controls.driveSpeed,controls.driveSpeed*turnRate);
			}else{
				//forward 
				boost.motorTimeMultiAsync(60,controls.driveSpeed,controls.driveSpeed);
			}

		}else if (controls.s){
			if (controls.a){
				//left back
				boost.motorTimeMultiAsync(60,-controls.driveSpeed*turnRate,-controls.driveSpeed);
			}else if(controls.d){
				//right back
				boost.motorTimeMultiAsync(60,-controls.driveSpeed,-controls.driveSpeed*turnRate);
			}else{
				//back 
				boost.motorTimeMultiAsync(60,-controls.driveSpeed,-controls.driveSpeed);
			}
		}else if (controls.a){
			//left spin
			boost.motorTimeMultiAsync(60,0,spinSpeed);
		}else if(controls.d){
			//right spin
			boost.motorTimeMultiAsync(60,spinSpeed,0);
		}else{
			//back 
			console.log("stop");
			boost.stop();
		} 

		controlsBefore = JSON.stringify(controls);
	}
}

let videoStream = null;
let videoElement = null;
let canvasElement = document.getElementById('canvas');
let canvasContext = canvasElement.getContext('2d');

// This function starts video capture and displays the video in a canvas element.
async function startVideoCapture() {
	try {
		// Reset the canvas to 256x256 pixels.
		canvasElement.width = 256;
		canvasElement.height = 256;

		// Request access to the media devices and get the video stream.
		videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
		videoElement = document.createElement('video');
		videoElement.srcObject = videoStream;
		videoElement.play();

		// Draw the video frame to the canvas when it's playing.
		videoElement.addEventListener('playing', () => {
			drawVideoToCanvas();
		});
	} catch (error) {
		console.error('Error accessing the camera', error);
	}
}

// This function continuously draws the video to the canvas, cropping it to be square.
function drawVideoToCanvas() {
	const aspectRatio = videoElement.videoWidth / videoElement.videoHeight;
	let videoHeight = videoElement.videoHeight;
	let videoWidth = videoElement.videoWidth;

	// Calculate the size to crop the video to make it square.
	if (aspectRatio > 1) {
		videoWidth = videoHeight; // landscape
	} else {
		videoHeight = videoWidth; // portrait
	}

	const startX = (videoElement.videoWidth - videoWidth) / 2;
	const startY = (videoElement.videoHeight - videoHeight) / 2;

	// Draw the video frame to the canvas, cropping it to square.
	canvasContext.drawImage(videoElement, startX, startY, videoWidth, videoHeight, 0, 0, canvasElement.width, canvasElement.height);

	// Keep drawing frames to the canvas.
	requestAnimationFrame(drawVideoToCanvas);
}

// This function gets the current video frame from the canvas as a Base64-encoded JPEG.
function getCameraImageBase64() {
// Convert the current canvas frame to a data URL (base64).
	return canvasElement.toDataURL('image/jpeg');
}

function float32ArrayToWavBlob(float32Array, sampleRate) {
	// Create a buffer for the WAV file with headers + audio data
	const buffer = new ArrayBuffer(44 + float32Array.length * 2);
	const view = new DataView(buffer);

	// Write WAV header to buffer
	function writeString(view, offset, string) {
		for (let i = 0; i < string.length; i++) {
			view.setUint8(offset + i, string.charCodeAt(i));
		}
	}
	// RIFF header
	writeString(view, 0, 'RIFF');
	view.setUint32(4, 36 + float32Array.length * 2, true);
	writeString(view, 8, 'WAVE');
	// fmt subchunk
	writeString(view, 12, 'fmt ');
	view.setUint32(16, 16, true); // subchunk1Size
	view.setUint16(20, 1, true); // audioFormat (1 = PCM)
	view.setUint16(22, 1, true); // numChannels
	view.setUint32(24, sampleRate, true); // sampleRate
	view.setUint32(28, sampleRate * 2, true); // byteRate (sampleRate * numChannels * bytesPerSample)
	view.setUint16(32, 2, true); // blockAlign (numChannels * bytesPerSample)
	view.setUint16(34, 16, true); // bitsPerSample
	// data subchunk
	writeString(view, 36, 'data');
	view.setUint32(40, float32Array.length * 2, true);

	// Write PCM audio data
	for (let i = 0; i < float32Array.length; i++) {
		const index = 44 + i * 2;
		const value = Math.max(-1, Math.min(1, float32Array[i])); // clamp
		view.setInt16(index, value < 0 ? value * 0x8000 : value * 0x7FFF, true);
	}

	return new Blob([view], { type: 'audio/wav' });
}

async function sendAudioToWhisper(audioBlob) {
    const formData = new FormData();
    formData.append('file', audioBlob, 'audio.wav');
    formData.append('model', 'whisper-1');  // Specify the model parameter here
	formData.append('response_format', 'verbose_json'); 
	formData.append('temperature', '0'); 
	formData.append('prompt', ''); 
	formData.append('language', 'en'); 


    try {
        const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                //'Content-Type': 'multipart/form-data'
            },
            body: formData
        });
        const result = await response.json();
        console.log('Whisper Transcription:', result);

		if (result.segments.length > 0 && result.text && result.text.length > 0) {
            if(result.segments[0].no_speech_prob > 0.5){
                console.log('No speech detected');
                
            }else{
                
				p = Math.exp(result.segments[0].avg_logprob);
				console.log(result.text,p);

				if (p> 0.45){
					chatGPT(result.text);
				}else{
					$("#speech").html(result.text+` (p=${p})` );
					say("Didn't get that");
				}
            }
        }

		
    } catch (error) {
        console.error('Error sending audio to Whisper:', error);
    }
}






// SPEECH

var audio = new Audio();

async function say(text) {
    console.log("Saying: ", text);
    $("#saying").html(text);

    var formData = JSON.stringify({
        'model': 'tts-1',
        'voice': 'onyx',
        'input': text
    });
    try {
        const openaiTTSResponse = await $.ajax({
            url: 'https://api.openai.com/v1/audio/speech',
            method: 'POST',
            xhrFields: {
                responseType: "arraybuffer"
            },
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            data: formData
        });
        
        var blob = new Blob([openaiTTSResponse]);
        if (blob) {
            var blobURL = URL.createObjectURL(blob);
            
            return new Promise((resolve, reject) => {
                
                audio.src = blobURL;
                audio.onended = () => {
                    console.log("Audio playback finished.");
                    resolve();  // Resolves the promise when audio ends, allowing the async function to proceed
                };
                audio.onerror = (e) => {
                    console.error("Error playing audio:", e);
                    reject(e);  // Rejects the promise if there is an error
                };
                audio.play();
            });
        }
    } catch (error) {
        console.error('Error TTS:', error);
    }
}

var currentRequest = null; // Store the current request's controller
var currentPrompt = "";

function chatGPT(promptText, withImage = false) {
    if (currentRequest) {
		console.log("Aborting current request");
        currentRequest.abort(); // Abort the current request if it's still active
		currentPrompt = currentPrompt+" "+promptText;
    }else{
		currentPrompt = promptText;
	}

    displayEmoji("2728");
    $("#saying").html("");
	$("#speech").html(currentPrompt);

    // Get OpenAI API key from the input field
    var apiKey = $("#openAIKey").val();

    if (withImage) {
        var base64Image = getCameraImageBase64();

        messagesHistory.push({
            "role": "user",
            "content": [{
                    "type": "text",
                    "text": currentPrompt
                },
                {
                    "type": "image_url",
                    "image_url": {
                        "url": base64Image
                    }
                }
            ]
        });
    } else {
        messagesHistory.push({
            "role": "user",
            "content": currentPrompt
        });
    }

    // Define the payload according to the OpenAI API specifications
    var dataPayload = {
        "model": "gpt-4-turbo",
        "temperature": 1,
        "max_tokens": 4000,
        "messages": messagesHistory
    };

    console.log(dataPayload);

    // AJAX call to OpenAI API
    currentRequest = $.ajax({
        url: "https://api.openai.com/v1/chat/completions",
        type: "POST",
        headers: {
            "Authorization": "Bearer " + apiKey,
            "Content-Type": "application/json"
        },
        data: JSON.stringify(dataPayload),
        success: function(response) {
			currentRequest = null;

            messagesHistory.push({
                "role": "assistant",
                "content": response.choices[0].message.content
            });
            try {
				

                var code = "(async function (){\n" +
                    response.choices[0].message.content.replace(/```javascript/g, '').replace(/```/g, '') +
                    "\n})();\n";
                console.log(code);

                try {
                    eval(code);
                } catch (e) {
                    // GPT returned wrong code, try just saying it
                    say(code);
                }

                boost.led("green");

            } catch (e) {
                console.log(e);
                boost.led("red");
            }

        },
        error: function(xhr, status, error) {
			currentRequest = null;
			
            console.log("GPT Error", xhr);
            if (xhr.status == 429) {
                say("Oops, too many requests, pausing for 10 seconds");
                setTimeout(function() {
                    chatGPT(promptText);
                }, 10000);
            }
        }
    });
}
